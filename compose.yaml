services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: conflux
      POSTGRES_USER: conflux
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a local .env file}
    ports:
      - "5432:5432"
    volumes:
      - conflux-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conflux -d conflux"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  conflux-postgres:
